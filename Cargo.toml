[workspace]
members = [
    "crates/core",
    "crates/server",
    "crates/cli",
]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom", "log"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
